{{- if and .Values.dbSecrets.enabled (not .Values.dbSecrets.existingSecretName) }}
{{- $secretName := include "openrun.dbSecretsKeySecretName" . }}
{{- $keyName := .Values.dbSecrets.keyName }}
{{- $keyMaterial := printf "k1:%s" (randBytes 32) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data $keyName) }}
{{- $keyMaterial = index $existing.data $keyName | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "openrun.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $keyName }}: {{ $keyMaterial | quote }}
{{- end }}
