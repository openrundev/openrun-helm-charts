suite: DB Secrets Key Tests
templates:
  - db-secrets-key.yaml
  - config-secret.yaml
tests:
  - it: creates a namespaced encryption key and references it from the db provider
    set:
      registry.enabled: true
    asserts:
      - isKind:
          of: Secret
        template: db-secrets-key.yaml
      - matchRegex:
          path: metadata.name
          pattern: '.*-db-secrets-key$'
        template: db-secrets-key.yaml
      - matchRegex:
          path: stringData.key
          pattern: '^k1:[A-Za-z0-9+/]{43}=$'
        template: db-secrets-key.yaml
      - matchRegex:
          path: stringData["openrun.toml"]
          pattern: '(?s)\[secret\.db\].*key = ''\{\{secret_from "kubernetes" ".*-db-secrets-key" "key"\}\}'''
        template: config-secret.yaml

  - it: references an externally managed secret without creating one
    set:
      registry.enabled: true
      dbSecrets.existingSecretName: externally-managed-key
      dbSecrets.keyName: encryption-key
    asserts:
      - hasDocuments:
          count: 0
        template: db-secrets-key.yaml
      - matchRegex:
          path: stringData["openrun.toml"]
          pattern: 'key = ''\{\{secret_from "kubernetes" "externally-managed-key" "encryption-key"\}\}'''
        template: config-secret.yaml

  - it: can leave db key management to custom OpenRun configuration
    set:
      registry.enabled: true
      dbSecrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: db-secrets-key.yaml
      - notMatchRegex:
          path: stringData["openrun.toml"]
          pattern: '\[secret\.db\]'
        template: config-secret.yaml
