name: Lint and Test Charts

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.0

      - name: Install helm-unittest plugin
        # Immutable commit for helm-unittest v0.5.1.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 96d1ad41ca628db9d10d2ac883d5d5e663efda48 --verify=false

      - name: Run verify
        run: make verify

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run chart-testing (install)
        run: ct install --all --helm-extra-set-args '--set=config.registry.url=localhost:5000 --timeout 3m --set=service.type=ClusterIP --set=config.http.port=25222 --set=config.https.port=25223' --debug
