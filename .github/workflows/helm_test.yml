name: Lint and Test Charts

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.0

      - name: Install helm-unittest plugin
        # Immutable commit for helm-unittest v0.5.1.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 96d1ad41ca628db9d10d2ac883d5d5e663efda48

      - name: Run verify
        run: make verify

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Run chart-testing (install)
        run: ct install --all --helm-extra-set-args '--set=config.registry.url=localhost:5000 --timeout 3m --set=service.type=ClusterIP --set=config.http.port=25222 --set=config.https.port=25223' --debug
